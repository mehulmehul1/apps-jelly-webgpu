<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vessel Gallery — Jellyfish Form Grammar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      overflow: hidden;
      background: #030308;
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
      color: #c9d1e8;
    }
    canvas { display: block; }

    /* ── Top bar ─────────────────────────────── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(180deg, rgba(3,3,8,0.85), rgba(3,3,8,0));
      pointer-events: none;
      z-index: 10;
    }
    #topbar > * { pointer-events: auto; }
    #brand {
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #7f8bb3;
    }
    #brand b { color: #ffb3d9; font-weight: 600; }

    #layerbar {
      display: flex;
      gap: 6px;
      background: rgba(10, 12, 24, 0.72);
      border: 1px solid rgba(120, 130, 180, 0.18);
      border-radius: 8px;
      padding: 5px;
      backdrop-filter: blur(6px);
    }
    .layer-btn {
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      padding: 7px 14px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: #8f99bd;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .layer-btn:hover:not(:disabled) { color: #e6ecff; background: rgba(255,179,217,0.08); }
    .layer-btn.active {
      color: #0a0610;
      background: #ffb3d9;
      font-weight: 600;
    }
    .layer-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    #navlinks {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #navlinks a {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #8f99bd;
      text-decoration: none;
      border-bottom: 1px solid rgba(143,153,189,0.3);
      padding-bottom: 2px;
    }
    #navlinks a:hover { color: #ffb3d9; border-color: #ffb3d9; }
    #seedlabel { font-size: 11px; color: #5d6a8f; }

    /* ── Top bar actions ─────────────────── */
    #topbar-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .topbar-btn {
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 5px;
      border: 1px solid rgba(120, 130, 180, 0.25);
      background: transparent;
      color: #8f99bd;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .topbar-btn:hover { color: #e6ecff; background: rgba(255,179,217,0.08); border-color: rgba(255,179,217,0.4); }
    .topbar-btn.active { color: #0a0610; background: #ffb3d9; font-weight: 600; border-color: #ffb3d9; }
    .topbar-btn .btn-icon { font-size: 13px; }
    #saved-count {
      font-size: 10px;
      color: #5d6a8f;
      letter-spacing: 0.08em;
      margin-left: 4px;
    }

    /* ── Filter bar ──────────────────────────── */
    #filterbar {
      position: fixed;
      top: 54px; left: 0; right: 0;
      display: flex;
      gap: 18px;
      align-items: flex-start;
      padding: 10px 20px;
      background: linear-gradient(180deg, rgba(3,3,8,0.75), rgba(3,3,8,0));
      z-index: 8;
      pointer-events: none;
    }
    #filterbar > * { pointer-events: auto; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #5d6a8f;
    }
    .filter-chips { display: flex; flex-wrap: wrap; gap: 4px; max-width: 480px; }
    .filter-chip {
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.06em;
      padding: 4px 9px;
      border-radius: 4px;
      border: 1px solid rgba(120,130,180,0.25);
      background: transparent;
      color: #8f99bd;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-chip:hover { color: #e6ecff; background: rgba(255,179,217,0.08); }
    .filter-chip.active {
      color: #0a0610;
      background: #ffb3d9;
      font-weight: 600;
      border-color: #ffb3d9;
    }
    #filter-count {
      margin-left: auto;
      font-size: 11px;
      color: #7f8bb3;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    /* ── Bottom hint ─────────────────────────── */
    #hint {
      position: fixed;
      bottom: 16px; left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: #56618a;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 5;
    }

    /* ── Hero overlay ────────────────────────── */
    #heropanel {
      position: fixed;
      top: 64px; right: 18px;
      width: 260px;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      background: rgba(10, 12, 24, 0.8);
      border: 1px solid rgba(120, 130, 180, 0.18);
      border-radius: 10px;
      padding: 14px;
      backdrop-filter: blur(8px);
      z-index: 9;
      display: none;
    }
    #heropanel.visible { display: block; }
    #hero-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffb3d9;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    #hero-sub {
      font-size: 11px;
      color: #7f8bb3;
      margin-bottom: 12px;
    }
    #hero-surface {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }
    .surface-btn {
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 9px;
      border-radius: 5px;
      border: 1px solid rgba(120, 130, 180, 0.25);
      background: transparent;
      color: #8f99bd;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .surface-btn:hover { color: #e6ecff; background: rgba(255,179,217,0.08); }
    .surface-btn.active {
      color: #0a0610;
      background: #ffb3d9;
      font-weight: 600;
      border-color: #ffb3d9;
    }
    .style-variant-btn {
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.06em;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,179,217,0.3);
      background: transparent;
      color: #ffb3d9;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .style-variant-btn:hover {
      background: rgba(255,179,217,0.14);
      border-color: #ffb3d9;
    }
    .slider-row { margin-bottom: 10px; }
    .slider-head {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #aab4d6;
      margin-bottom: 3px;
    }
    .slider-head .val { color: #ffb3d9; }
    .slider-row input[type=range] {
      width: 100%;
      height: 3px;
      appearance: none;
      background: rgba(255,179,217,0.25);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .slider-row input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ffb3d9;
      border: none;
      cursor: pointer;
    }
    #hero-actions { margin-top: 14px; display: flex; gap: 8px; }
    .ghost-btn {
      flex: 1;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,179,217,0.35);
      background: transparent;
      color: #ffb3d9;
      cursor: pointer;
    }
    .ghost-btn:hover { background: rgba(255,179,217,0.12); }
    #hero-save.saved {
      background: rgba(255,179,217,0.2);
      border-color: #ffb3d9;
      color: #ffb3d9;
      font-weight: 600;
    }

    /* Scrollbar */
    #heropanel::-webkit-scrollbar { width: 5px; }
    #heropanel::-webkit-scrollbar-thumb { background: rgba(255,179,217,0.25); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="topbar">
    <div id="brand">Vessel Gallery · <b>form grammar</b></div>
    <div id="layerbar"></div>
    <div id="navlinks">
      <span id="seedlabel">seed —</span>
      <a href="/" id="to-viewer">→ viewer</a>
    </div>
    <div id="topbar-actions">
      <button class="topbar-btn" id="btn-view-all" title="Show all forms">
        <span class="btn-icon">◧</span> All
      </button>
      <button class="topbar-btn" id="btn-view-saved" title="Show saved forms only">
        <span class="btn-icon">♥</span> Saved
        <span id="saved-count"></span>
      </button>
      <button class="topbar-btn" id="btn-randomize" title="Randomize seed for new variations">
        <span class="btn-icon">⟳</span> Randomize
      </button>
    </div>
  </div>

  <div id="filterbar">
    <div class="filter-group">
      <span class="filter-label">order</span>
      <div class="filter-chips" id="filters-order"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">section</span>
      <div class="filter-chips" id="filters-section"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">surface</span>
      <div class="filter-chips" id="filters-surface"></div>
    </div>
    <div id="filter-count">—</div>
  </div>

  <div id="hint">drag to orbit · scroll to zoom · click a vessel to inspect · pulse & spin via the motion pane</div>
  <div id="heropanel">
    <div id="hero-title">—</div>
    <div id="hero-sub">—</div>
    <div id="hero-surface"></div>
    <div id="hero-sliders"></div>
    <div id="hero-actions">
      <button class="ghost-btn" id="hero-save" title="Save this form to your collection">♥ save</button>
      <button class="ghost-btn" id="hero-reroll">↻ re-roll</button>
      <button class="ghost-btn" id="hero-back">← back to grid</button>
    </div>
  </div>

  <canvas id="gallery-canvas"></canvas>
  <script type="module" src="/src/gallery/main.ts"></script>
</body>
</html>
